services:
  steam-gamescope:
    build: ./src
    restart: no
    hostname: steam-headless

    # GPU access via NVIDIA runtime
    runtime: nvidia

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XDG_RUNTIME_DIR=/tmp/runtime
      - PULSE_SERVER=unix:/tmp/pulse/native
      - GAMESCOPE_BACKEND
      - GAMESCOPE_RESOLUTION
      - GAMESCOPE_FRAMERATE
      - DEFAULT_SESSION
      - HEADLESS_DEBUG

    volumes:
      - ./steam-data/steam:/home/steam/.local/share/Steam:rw
      - ./steam-data/.steam:/home/steam/.steam:rw
      - ./steam-data/.wireplumber:/home/steam/.local/state/wireplumber:rw
      - /dev/dri:/dev/dri:rw
      - /run/user/1000/pulse:/tmp/pulse:rw
      - /run/user/1000/wayland-0:/tmp/runtime/host-wayland-0:rw

    devices:
      - /dev/dri:/dev/dri

    shm_size: '2gb'

    ulimits:
      rtprio: 95
      nice: 40

    cap_add:
      - SYS_ADMIN
      - SYS_NICE

    security_opt:
      - seccomp:./seccomp.json
      - label:disable
